name: Destroy

# Manual. Terceiro da cadeia de destroy: lambda -> app -> infra-db -> infra-k8s.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Digite exatamente destroy para confirmar"
        required: true
        type: string

concurrency:
  group: infra-db
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  AWS_REGION: us-east-1
  TF_STATE_KEY: tech-challenge/infra-db.tfstate
  SSM_PREFIX: /tech-challenge

jobs:
  destroy:
    name: Terraform destroy
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require master branch
        run: |
          if [ "${GITHUB_REF}" != "refs/heads/master" ]; then
            echo "Rode este workflow com a branch master selecionada."
            exit 1
          fi

      - name: Confirm destroy
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "destroy" ]; then
            echo "Abortado: o campo confirm precisa ser exatamente: destroy"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_APPLY }}
          aws-region: ${{ env.AWS_REGION }}

      # Fail-fast do contrato: a Lambda tem uma regra no SG do RDS (o destroy do SG travaria
      # até o timeout) e a app perderia o banco com os pods de pé.
      - name: Require dependents destroyed
        run: |
          set -eu
          blocked=0
          for scope in lambda app; do
            names="$(aws ssm get-parameters-by-path --path "${SSM_PREFIX}/${scope}" --recursive \
              --query 'Parameters[].Name' --output text)"
            if [ -n "$names" ]; then
              echo "::error::Ainda existem parâmetros em ${SSM_PREFIX}/${scope}: ${names}. Rode o Destroy desse repositório antes."
              blocked=1
            fi
          done
          exit "$blocked"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${{ vars.TF_STATE_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      # Mesma senha do deploy: mantém a config idêntica à do apply (a precondition exige 32+).
      - name: Terraform destroy
        env:
          TF_VAR_rds_master_password: ${{ secrets.DB_ROOT_PASSWORD }}
        run: terraform destroy -auto-approve -var-file=env/aws.tfvars
